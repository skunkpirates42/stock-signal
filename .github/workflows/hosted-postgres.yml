name: Hosted PostgreSQL gate

on:
  pull_request:
  push:
    branches:
      - issue-46-hosted-postgres
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install 'pytest>=8,<9' 'psycopg[binary]>=3.2,<4' 'PyJWT[crypto]>=2.15,<3'
      - name: Record test revisions
        run: |
          git rev-parse HEAD
          docker inspect --format '{{.Image}}' ${{ job.services.postgres.id }}
          python -c 'import psycopg; print("psycopg", psycopg.__version__)'
      - name: Test hosted PostgreSQL contract
        env:
          HOSTED_PG_TEST_DSN: postgresql://postgres:fixture-only@127.0.0.1:5432/postgres
        run: python -m pytest tests/test_hosted_jobs.py tests/test_hosted_jobs_pg.py -q --tb=short
